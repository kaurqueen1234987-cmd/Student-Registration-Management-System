
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#eef2ff;color:#222}
header{background:linear-gradient(120deg,#4338ca,#9333ea);color:white;text-align:center;padding:25px}
.container{max-width:1100px;margin:30px auto;padding:15px}
.cards{display:flex;gap:15px;flex-wrap:wrap}
.card,.form-box,.table-box{background:white;padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 3px 12px #0001}
.card{flex:1;min-width:180px}
.card h2{color:#4f46e5}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:7px}
button{background:#4f46e5;color:white;border:0;padding:12px 18px;border-radius:7px;cursor:pointer;margin:5px}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{padding:12px;border-bottom:1px solid #ddd;text-align:left}
th{background:#4f46e5;color:white}
.table-box{overflow-x:auto}
#message{color:#4f46e5}
</style>
</head>
<body>

<header>
<h1>Student Management System</h1>
<p>Manage Student Records Easily</p>
<button id="logoutBtn">Logout</button>
</header>

<div class="container">
<div class="cards">
<div class="card">
<h3>Total Students</h3>
<h2 id="totalStudents">0</h2>
</div>
<div class="card">
<h3>Welcome</h3>
<h2 id="welcome">Student</h2>
</div>
</div>

<div class="form-box">
<h2>Add New Student</h2>
<input id="name" placeholder="Student Name">
<input id="email" type="email" placeholder="Email Address">
<input id="phone" placeholder="Phone Number">
<input id="course" placeholder="Course Name">
<button id="addBtn">Add Student</button>
<p id="message"></p>
</div>

<div class="table-box">
<h2>Student Records</h2>
<input id="search" placeholder="Search Student">
<table>
<thead>
<tr><th>Name</th><th>Email</th><th>Phone</th><th>Course</th></tr>
</thead>
<tbody id="studentTable">
<tr><td colspan="4">Loading records...</td></tr>
</tbody>
</table>
</div>
</div>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {getAuth,onAuthStateChanged,signOut}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
apiKey:"AIzaSyDlFOW4R4guY33-HkM3Lcms_ZgaaBO7Xys",
authDomain:"student-management-syste-bfb0e.firebaseapp.com",
projectId:"student-management-syste-bfb0e",
storageBucket:"student-management-syste-bfb0e.firebasestorage.app",
messagingSenderId:"1014947615526",
appId:"1:1014947615526:web:49c33237264557f9c5a7e7",
measurementId:"G-PER6S3KD3F"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);

// Paste your Google Apps Script Web App /exec URL here
const GOOGLE_SCRIPT_URL="YOUR_GOOGLE_SCRIPT_EXEC_URL";

let students=[];

const table=document.getElementById("studentTable");
const message=document.getElementById("message");

onAuthStateChanged(auth,user=>{
if(!user){
window.location.href="index.html";
return;
}

document.getElementById("welcome").textContent=
user.displayName||user.email;

loadStudents();
});

async function loadStudents(){
try{
const response=await fetch(GOOGLE_SCRIPT_URL);
if(!response.ok)throw new Error("Loading failed");

students=await response.json();
if(!Array.isArray(students))throw new Error("Invalid data");

displayStudents(students);
}catch(error){
table.innerHTML=
'<tr><td colspan="4">Could not load records. Check Apps Script URL and doGet().</td></tr>';
}
}

function displayStudents(data){
table.innerHTML="";

if(data.length===0){
table.innerHTML='<tr><td colspan="4">No student records found</td></tr>';
}else{
data.forEach(s=>{
const row=document.createElement("tr");

[s.name,s.email,s.phone,s.course].forEach(value=>{
const cell=document.createElement("td");
cell.textContent=value||"";
row.appendChild(cell);
});

table.appendChild(row);
});
}

document.getElementById("totalStudents").textContent=data.length;
}

document.getElementById("addBtn").onclick=async()=>{
const student={
name:document.getElementById("name").value.trim(),
email:document.getElementById("email").value.trim(),
phone:document.getElementById("phone").value.trim(),
course:document.getElementById("course").value.trim()
};

if(Object.values(student).some(v=>!v)){
message.textContent="Please fill all fields.";
return;
}

try{
await fetch(GOOGLE_SCRIPT_URL,{
method:"POST",
mode:"no-cors",
headers:{"Content-Type":"text/plain;charset=utf-8"},
body:JSON.stringify(student)
});

message.textContent="Request sent. Check your Google Sheet to confirm.";
}catch(error){
message.textContent="Error sending data.";
}
};

document.getElementById("search").oninput=e=>{
const q=e.target.value.toLowerCase();
displayStudents(students.filter(s=>
(s.name||"").toLowerCase().includes(q)||
(s.email||"").toLowerCase().includes(q)
));
};

document.getElementById("logoutBtn").onclick=async()=>{
await signOut(auth);
window.location.href="index.html";
};
</script>
</body>
</html>
