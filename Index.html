

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:linear-gradient(135deg,#6366f1,#c084fc);min-height:100vh;display:grid;place-items:center;padding:20px}
.container{background:white;padding:30px;border-radius:18px;width:100%;max-width:400px;box-shadow:0 8px 25px #0002}
h1{text-align:center;color:#4f46e5}
input{width:100%;padding:13px;margin:9px 0;border:1px solid #ccc;border-radius:8px}
button{width:100%;padding:13px;margin-top:12px;background:#4f46e5;color:white;border:0;border-radius:8px;cursor:pointer}
.switch{text-align:center;margin-top:18px;color:#4f46e5;cursor:pointer}
#message{text-align:center;color:#dc2626}
</style>
</head>
<body>

<div class="container">
<h1 id="heading">Student Sign Up</h1>

<input id="name" placeholder="Full Name">
<input id="email" type="email" placeholder="Email Address">
<input id="password" type="password" placeholder="Password (minimum 6 characters)">

<button id="mainBtn">Create Account</button>
<p id="message"></p>
<p class="switch" id="switchBtn">Already have an account? Login</p>
</div>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,createUserWithEmailAndPassword,
signInWithEmailAndPassword,updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
apiKey:"AIzaSyDlFOW4R4guY33-HkM3Lcms_ZgaaBO7Xys",
authDomain:"student-management-syste-bfb0e.firebaseapp.com",
projectId:"student-management-syste-bfb0e",
storageBucket:"student-management-syste-bfb0e.firebasestorage.app",
messagingSenderId:"1014947615526",
appId:"1:1014947615526:web:49c33237264557f9c5a7e7",
measurementId:"G-PER6S3KD3F"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);

let isLogin=false;

const name=document.getElementById("name");
const email=document.getElementById("email");
const password=document.getElementById("password");
const message=document.getElementById("message");
const heading=document.getElementById("heading");
const mainBtn=document.getElementById("mainBtn");
const switchBtn=document.getElementById("switchBtn");

switchBtn.onclick=()=>{
isLogin=!isLogin;
heading.textContent=isLogin?"Student Login":"Student Sign Up";
mainBtn.textContent=isLogin?"Login":"Create Account";
switchBtn.textContent=isLogin?
"New student? Create account":
"Already have an account? Login";
name.style.display=isLogin?"none":"block";
message.textContent="";
};

mainBtn.onclick=async()=>{
message.textContent="";

const e=email.value.trim();
const p=password.value;
const n=name.value.trim();

if(!e||!p||(!isLogin&&!n)){
message.textContent="Please fill all required fields.";
return;
}

if(p.length<6){
message.textContent="Password must be at least 6 characters.";
return;
}

mainBtn.disabled=true;

try{
if(isLogin){
await signInWithEmailAndPassword(auth,e,p);
}else{
const result=await createUserWithEmailAndPassword(auth,e,p);
await updateProfile(result.user,{displayName:n});
}

window.location.href="student.html";

}catch(error){
message.textContent=error.message;
}finally{
mainBtn.disabled=false;
}
};
</script>
</body>
</html>
